name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  evidence:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - shell: pwsh
        run: npm test
      - if: runner.os == 'Windows'
        shell: pwsh
        run: .\verify-release.ps1
