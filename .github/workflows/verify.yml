name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm.cmd test
      - shell: powershell
        run: .\verify-release.ps1
